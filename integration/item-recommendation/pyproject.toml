[project]
name = "item-recommendation"
version = "0.1.0"
description = "Offline recommendation system combining Apriori, KNN Content-Based, and KNN Collaborative filtering"
readme = "README_PIPELINE.md"
requires-python = ">=3.8"
dependencies = [
    "pandas>=1.3.0",
    "numpy>=1.20.0",
    "scikit-learn>=0.24.0",
    "efficient-apriori>=2.0.0",
    "pyarrow>=5.0.0"
]

[project.optional-dependencies]
dev = [
    "jupyter>=1.0.0",
    "matplotlib>=3.3.0",
]
