[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "seller-forecaster"
version = "1.0.0"
description = "ARIMA time-series forecasting for seller revenue"
requires-python = ">=3.9"
dependencies = [
    "pandas==2.2.0",
    "numpy==1.26.3",
    "statsmodels==0.14.1",
    "pyarrow>=5.0.0"
]